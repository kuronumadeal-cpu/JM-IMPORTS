<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rastreio | JM IMPORTS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">JM IMPORTS</a>
      <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="checkout.html">Checkout</a>
        <a class="active" href="rastreio.html">Rastreio</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
      </nav>
      <a class="cart-chip" href="checkout.html">Carrinho: <span data-cart-count>0 item(ns)</span></a>
    </div>
  </header>

  <main class="container section">
    <section class="card">
      <h1>Rastreie seu pedido</h1>
      <p class="section-subtitle">Digite o código enviado por e-mail ou WhatsApp.</p>
      <form data-track-form>
        <label>Código de rastreio<input placeholder="Ex: JM12345" /></label>
        <button type="submit" class="btn btn-primary">Consultar</button>
      </form>
      <p class="alert" data-track-result>Use um código para consultar o status.</p>
    </section>
  </main>

  <footer class="site-footer"><div class="container"><p>JM IMPORTS logística nacional.</p></div></footer>
  <script src="script.js"></script>
